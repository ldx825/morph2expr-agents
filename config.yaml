# 全局配置 —— 所有随机种子固定，保证可复现
seed: 20260115

# ---------------------------------------------------------------------------
# 数据集
# ---------------------------------------------------------------------------
datasets:
  # 主数据集：A549 细胞系 + 化合物扰动（样本量最大、配对最全）
  primary: LINCS-Pilot1
  # 参与建模的全部子集；缺失的子集会被自动跳过并记录告警
  include:
    - LINCS-Pilot1
    - TA-ORF-BBBC037-Rohban
    - LUAD-BBBC041-Caicedo
    - CDRP-BBBC047-Bray
  # 用于"跨数据集迁移"实验的留出子集（不在训练集出现）
  heldout_for_transfer: LUAD-BBBC041-Caicedo

# ---------------------------------------------------------------------------
# 智能体 1：质控
# ---------------------------------------------------------------------------
qc:
  # 非生物学特征一律剔除：孔板坐标、质心位置、编号等
  blocklist_regex:
    - ".*_Center_[XY]$"
    - ".*Location_Center.*"
    - ".*_Number_Object_Number$"
    - ".*_ObjectNumber$"
    - ".*_Parent_.*"
    - ".*_Children_.*Count$"
  # 方差过滤：丢弃方差最低的这部分特征
  variance_low_quantile: 0.02
  # 相关性过滤：|r| 超过阈值的高冗余特征只保留一个
  corr_threshold: 0.95
  # 单孔极端离群剔除：以主成分的稳健 z 分数判定
  outlier_pc_count: 5
  outlier_z: 5.0
  # 每个扰动至少要有多少个重复才进入建模
  min_replicates: 3

# ---------------------------------------------------------------------------
# 智能体 2：形态特征
# ---------------------------------------------------------------------------
morph:
  # 按批次（孔板）内做 z 标准化，抵消染色/曝光差异
  normalize_within_batch: true
  # 聚合方式：mean / median
  aggregate: mean
  clip_z: 10.0

# ---------------------------------------------------------------------------
# 智能体 3：转录组预处理
# ---------------------------------------------------------------------------
expr:
  # L1000 数值裁剪（稳健 z 之后），抑制 level-3 的极端离群
  clip_z: 10.0
  # 重复一致性过滤：同一扰动各重复之间的中位 Spearman 相关
  min_replicate_spearman: 0.10
  # 差异基因判定阈值（在 Δ 表达上以标准差倍数表示）
  dge_sd_multiplier: 1.0

# ---------------------------------------------------------------------------
# 智能体 4：扰动编码
# ---------------------------------------------------------------------------
perturbation:
  morgan_bits: 1024
  morgan_radius: 2
  compound_svd_dim: 64
  gene_svd_dim: 32

# ---------------------------------------------------------------------------
# 智能体 5：跨模态预测
# ---------------------------------------------------------------------------
model:
  outer_folds: 5            # 按扰动分组的交叉验证折数
  inner_folds: 3
  lasso_alphas: [0.001, 0.003, 0.01, 0.03, 0.1, 0.3, 1.0]
  lasso_n_jobs: 16          # 逐基因 Lasso 的并行进程数（机器 128 核，共享环境取保守值）
  mlp_hidden: [256, 128]
  mlp_alpha: 0.001
  mlp_max_iter: 400
  mlp_early_stopping: true
  # 置换检验（负对照）次数
  permutation_repeats: 2
  # 小于该扰动数的数据集不参与 OOD 评估
  min_perturbations: 20

# ---------------------------------------------------------------------------
# 智能体 6：批次效应诊断
# ---------------------------------------------------------------------------
batch:
  classifier: logistic        # logistic | knn
  knn_neighbors: 15
  logistic_max_iter: 2000
  # 批次定义：plate = 单孔板 | dataset = 数据集级别
  definition: plate
  correction: combat
  # 校正强度（1.0 = 完整校正，0.0 = 不校正）
  combat_strength: 1.0
  # 是否使用经验贝叶斯收缩。本数据 每批样本数 < 特征数，EB 会把 gamma/delta
  # 强烈收缩到全局值，导致校正几乎失效，因此默认关闭（退化为位置-尺度校正，
  # 这也是 Cell Painting 领域按板校正的常规做法）。想对比 EB 效果时可以打开。
  combat_use_eb: false
  umap_neighbors: 15
  umap_min_dist: 0.1

# ---------------------------------------------------------------------------
# 智能体 7：生物验证
# ---------------------------------------------------------------------------
validation:
  # 通路基因集：优先使用本地 GMT；缺失则回退到内置精简集
  gmt_path: data/reference/h.all.symbols.gmt
  gmt_url: "https://data.broadinstitute.org/gsea-msigdb/msigdb/release/2023.1.Hs/h.all.v2023.1.Hs.symbols.gmt"
  # L1000 只覆盖 978 个 landmark 基因，因此通路内可匹配到的基因数天然偏少，
  # 这里把下限设得比常规 GSEA 低一些（常规为 15）。报告里需说明这一点。
  min_genes_per_set: 5
  max_genes_per_set: 300
  top_n_pathways: 15

# ---------------------------------------------------------------------------
# 出图
# ---------------------------------------------------------------------------
plot:
  dpi: 200
  style: whitegrid
  # 中文字体：优先使用 data/reference/fonts/ 下自带的 Noto Sans CJK SC，
  # 缺失时依次尝试系统字体，最后退回 DejaVu Sans（英文图仍可用）。
  font: Noto Sans CJK SC
